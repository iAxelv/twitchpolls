# ============================================
# TwitchPolls - Main Configuration
# ============================================
# For messages and language-specific content, see:
#   - lang/en.yml (English)
#   - lang/es.yml (Español)
#
# For Twitch API credentials, see:
#   - secrets.yml (Keep this file confidential!)

# Language configuration
lang: es

settings:
  streamer-username: "123456789" # Replace with your Minecraft username
  automatic-polls: false # Whether to automatically start polls at regular intervals
  poll-duration-seconds: 45 # Minimum: 45 seconds
  poll-interval-seconds: 60 # Minimum: 60 seconds
  broadcast-results: true # Whether to broadcast poll results to the server