# ============================================
# TwitchPolls - English Language Pack
# ============================================

settings:
  streamer-username: "iAx3lv"
  automatic-polls: false
  poll-duration-seconds: 45
  poll-interval-seconds: 60
  broadcast-results: true

messages:
  poll-title: "Decide the streamer's destiny!"
  poll-start-title: "&d[New Poll!]"
  poll-start-subtitle: "&fViewers are voting.."
  poll-end-title: "&a[Poll Ended!]"
  poll-end-subtitle: "&fWinner: &e%winner%"

  broadcast-start:
    - "&8&m---------------------------------"
    - "&d[Twitch] &f[New poll started!]"
    - "&fPoll options:"
    - "%options%"
    - "&8&m---------------------------------"

  broadcast-end: "&d[Twitch] &fWinning option: &e%winner%"
  bossbar-title: "&dPoll: &f%time%s remaining"
  next-poll-bossbar-title: "&dNext poll: &f%time%s"
  command-reload: "&aConfiguration reloaded successfully."
  command-reconnect: "&aRetrying connection..."
  points-event-title: "&c[Points Event!]"
  points-event-subtitle: "&f%event% &7(%value% points)"
  points-event-duration: "&eEnds in: &f%time%s"
  points-event-broadcast: "&d[Twitch] &f%event% &7was activated by &e%value% points &7(%username%)"
  donation-event-title: "&c[DONATION EVENT!]"
  donation-event-subtitle: "&f%event% &7(%value% %type%)"
  tiktok-follow-event-title: "&d[TIKTOK FOLLOW!]"
  tiktok-follow-event-subtitle: "&f%event%"
  tiktok-likes-event-title: "&d[TIKTOK LIKES!]"
  tiktok-likes-event-subtitle: "&f%event%"
  tiktok-heart-me-title: "&dRoulette"
  tiktok-heart-me-subtitle: "&f%event%"
  tiktok-heart-me-winner: "&d[TikTok] &fThe roulette selected: &e%event%"
  donation-event-broadcast: "&d[%provider%] &f%event% &7was activated by &e%value% %type% &7(%username%)"
  tiktok-gift-event-broadcast: "&d[TikTok] &f%event% &7was activated by &e%value% %gift% &7(%username%)"
  tiktok-follow-event-broadcast: "&d[TikTok] &f%event% &7was activated by a follow &7(%username%)"
  tiktok-likes-broadcast: "&d[TikTok] &f%event% &7was activated after &e%likes% likes"
  command-player-only: "&cThis subcommand can only be used in-game."
  disable-action-title: "&cAction blocked: &f%action%"
  gui:
    categories-missing: "&cNo categories configured in gui.yml."
    actions-missing: "&cNo actions configured for %category%."
    action-missing: "&cNo configuration found for %action%."
  spawn-veneco-name: "VENECO PRIME"
  spawn-veneco-broadcast: "A veneco appeared in the world"
  hot-potato-actionbar: "&cHot potato: %time%s"
  balloons-actionbar: "&eBalloons: &f%time%s"
  hot-potato-saved: "&aHot potato passed!"
  hot-potato-boom-title: "&4&lBOOM!"
  hot-potato-boom-subtitle: "&cYou did not pass the hot potato in time"

# ============================================
# ACTION-SPECIFIC CONFIGURATIONS
# ============================================

actions:
  # Disable Action - Localized action names
  disable-action:
    names:
      WALK: "Walk"
      JUMP: "Jump"
      BREAK_BLOCKS: "Break Blocks"
      PLACE_BLOCKS: "Place Blocks"
      INTERACT_BLOCKS: "Interact with Blocks"
      ATTACK_MOBS: "Attack Mobs"
      MOVE_ITEMS: "Move Items"

  # Item Name Swap - Localized item fake names
  item-name-swap:
    item-names:
      - "&cWhat is this?"
      - "&dLegendary Potato"
      - "&eSuspicious Object"
      - "&bShiny Thing"
