# ============================================
# TWITCH API CREDENTIALS - KEEP CONFIDENTIAL
# ============================================
# This file contains sensitive information.
# DO NOT share or commit this file to version control.
# DO NOT share these credentials with anyone.
# 
# If credentials are accidentally exposed:
# 1. Regenerate them immediately at https://dev.twitch.tv/console/apps
# 2. Update this file with new credentials
# 3. Restart the plugin

twitch:
  client-id: "YOUR_TWITCH_CLIENT_ID"
  client-secret: "YOUR_TWITCH_CLIENT_SECRET"
  oauth-token: "YOUR_TWITCH_OAUTH_TOKEN"
  refresh-token: "YOUR_TWITCH_REFRESH_TOKEN"
  broadcaster-id: "YOUR_TWITCH_BROADCASTER_ID"
