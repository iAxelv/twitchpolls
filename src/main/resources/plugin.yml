name: TwitchPolls
version: '${version}'
main: com.foxy.twitchPolls.TwitchPolls
api-version: '1.21.8'
load: POSTWORLD
commands:
  twitch:
    description: Administra las encuestas y prueba acciones de Twitch
    usage: /twitch <poll|reload|test>
    permission: twitchpolls.poll
permissions:
  twitchpolls.poll:
    description: Permite administrar encuestas de Twitch
    default: op