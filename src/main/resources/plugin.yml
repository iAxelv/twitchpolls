name: StreamManager
version: '${version}'
main: com.foxy.streammanager.TwitchPolls
api-version: '1.21'
load: POSTWORLD
commands:
  streammanager:
    description: Manage Twitch and TikTok events
    usage: /streammanager <reload|reconnect|test|config>
    aliases: [sm]
    permission: twitchpolls.poll
permissions:
  twitchpolls.poll:
    description: Allows managing Twitch and TikTok events
    default: op